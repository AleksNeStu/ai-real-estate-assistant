# Semgrep Configuration for AI Real Estate Assistant
# Runs SAST (Static Application Security Testing) on Python and JavaScript/TypeScript

rules:
  # ===== Python Security Rules =====

  # Dangerous function usage
  - id: python.dangerous-functions
    pattern-either:
      - pattern: eval($USER_INPUT)
      - pattern: exec($USER_INPUT)
      - pattern: __import__($USER_INPUT)
      - pattern: os.system($USER_INPUT)
      - pattern: subprocess.call($USER_INPUT, shell=True)
      - pattern: subprocess.Popen($USER_INPUT, shell=True)
    message: "Dangerous function executed with user input - code execution risk"
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      technology:
        - python
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  # Hardcoded secrets - more specific patterns to reduce false positives
  - id: python.hardcoded-secrets
    pattern-either:
      - pattern: |
          $PASSWORD = "=~.*(sk_|pk_|api_|secret_|token_|auth_).+"
      - pattern: |
          $API_KEY = "=~.*(sk_|pk_|api_|secret_|token_|auth_).+"
      - pattern: |
          $SECRET = "=~.*(sk_|pk_|api_|secret_|token_|auth_).+"
      - pattern: |
          $TOKEN = "=~.*(sk_|pk_|api_|secret_|token_|auth_).+"
    message: "Hardcoded secret detected - use environment variables"
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"

  # SQL Injection
  - id: python.sql-injection
    pattern-either:
      - pattern: |
          $CONN.execute($QUERY % $INPUT)
      - pattern: |
          $CONN.execute("$QUERY " + $INPUT)
      - pattern: |
          $CONN.execute(f"$QUERY{$INPUT}")
    message: "Possible SQL injection - use parameterized queries"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  # FastAPI-specific issues
  - id: fastapi.cors-wildcard
    pattern: CORSMiddleware(allow_origins=["*"], ...)
    message: "CORS configured with wildcard origins - allows any domain"
    severity: WARNING
    languages: [python]

  # LangChain prompt injection
  - id: langchain.prompt-injection
    pattern-either:
      - pattern: PromptTemplate(template=$USER_INPUT + "...")
      - pattern: PromptTemplate.from_template($USER_INPUT)
    message: "User input directly in prompt template - potential prompt injection"
    severity: WARNING
    languages: [python]

  # LangChain: untrusted data must not ride the system role (Task #151)
  #
  # A system message is an INSTRUCTION to the model. Data the model did not
  # author - the buyer's memory, a listing title, a tool's output - belongs in
  # a human message, labelled as data. The rule names the class, so the next
  # place that reaches for the system role is caught before it ships.
  #
  # The rule reads the WHOLE backend (Task #158). It used to read only
  # apps/api/agents/**, so it could not see the places that build a prompt
  # outside that directory - ai/context_manager.py and api/routers/** - and
  # those are exactly where a system role sneaks back in.
  - id: langchain.system-role-untrusted-data
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted data must not be placed in a system message - a system message is an
      instruction to the model. Put the data in a human message and label it as data
      (the buyer's record, a listing text, a tool output).
    paths:
      # The scope of the rule has to hold in EVERY shape a scan can take.
      #
      # Semgrep matches these patterns against the path RELATIVE TO THE
      # PROJECT ROOT, and the project root of a scan is the common ancestor
      # of its targets. For a FILE target that ancestor is the file's own
      # directory, so the path that is matched is the bare filename - and a
      # scope written as `apps/api/**` can never match it. Measured
      # 2026-11-28 with the scope as it stood:
      #
      #   - a file target (the pre-push hook passes the changed files): the
      #     rule never fires;
      #   - a directory target rooted at apps/api (the CI gate scans the
      #     directories it declares): the rule never fires;
      #   - a directory target with --project-root .: the rule fires.
      #
      # So the guard the operator believes runs at push time did not run, and
      # neither did the one in CI. The scope is therefore written in a shape
      # that holds everywhere: the include matches every Python file, and the
      # excludes name the tests by the names pytest collects them under, so a
      # test is pruned whether the scan reaches it as a directory or as a
      # single file.
      #
      # The include is broader than the backend on purpose. The rule matches
      # a Python file that builds a system message and nothing else, and the
      # repository's own source outside apps/api holds none (measured
      # 2026-11-28).
      include:
        - "**/*.py"
      exclude:
        # A test that writes the bad shape on purpose is the FIXTURE the rule
        # needs, not a violation of it. The shipped code is what the rule is
        # about.
        #
        # The names are the ones pytest collects a test under, because a
        # DIRECTORY alone does not survive a file target: the directory of a
        # changed test file is collapsed away, and only the file's own name
        # is left to match. `tests/**` covers the tree when the scan reaches
        # it as a directory.
        - "**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/conftest.py"
        # The virtualenvs live INSIDE apps/api, so the include would swallow
        # them - and the vendored langchain builds its own prompts with a
        # variable at the system role. The rule is about THIS repository's
        # code, not about the libraries it installs.
        - "**/.venv*/**"
        - "**/site-packages/**"
    patterns:
      - pattern-either:
          - pattern: $T.from_messages([..., ("system", $X), ...])
          - pattern: SystemMessage(content=$X)
      # A literal at the system role is the agent's own prompt. Two entries
      # because the two shapes are spelled differently - and because
      # pattern-not-either is not an operator semgrep has.
      - pattern-not: $T.from_messages([..., ("system", "..."), ...])
      - pattern-not: SystemMessage(content="...")
      # A variable that was assigned a literal in the same function is the
      # agent's own prompt, not data that came from outside.
      - pattern-not-inside: |
          def $F(...):
              ...
              $X = "..."
              ...
      - pattern-not-inside: |
          def $F(...):
              ...
              $X = f"..."
              ...
      # The context compressor rewrites a message IN PLACE: a system message
      # stays a system message and keeps ITS OWN content, compressed. That
      # content is the code's own prompt, not data that came from outside -
      # so this is the one place that may build a system message out of a
      # variable. The carve-out names the method, so a rename re-arms the
      # rule instead of quietly disarming it.
      - pattern-not-inside: |
          def _create_message_with_content(self, ...):
              ...

  # ===== JavaScript/TypeScript Security Rules =====

  # eval in JavaScript
  - id: javascript.eval
    pattern: eval($INPUT)
    message: "eval() is dangerous and can lead to code injection"
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"

  # dangerouslySetInnerHTML in React
  - id: react.dangerous-inner-html
    pattern: dangerouslySetInnerHTML={...}
    message: "dangerouslySetInnerHTML can lead to XSS vulnerabilities"
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"

  # Hardcoded secrets in JS/TS - more specific to reduce false positives
  - id: javascript.hardcoded-secrets
    pattern-either:
      - pattern: |
          const $SECRET = "=~.*(sk_|pk_|api_|secret_|token_|auth_|password_|key_).+"
      - pattern: |
          $API_KEY = "=~.*(sk_|pk_|api_|secret_|token_|auth_|password_|key_).+"
      - pattern: |
          process.env.$KEY = "=~.*(sk_|pk_|api_|secret_|token_|auth_|password_|key_).+"
    message: "Hardcoded secret in frontend code - secrets should be on backend only"
    severity: WARNING
    languages: [javascript, typescript]

  # localStorage with sensitive data
  - id: javascript.sensitive-localstorage
    pattern-either:
      - pattern: localStorage.setItem("password", $VALUE)
      - pattern: localStorage.setItem("token", $VALUE)
      - pattern: localStorage.setItem("api_key", $VALUE)
    message: "Storing sensitive data in localStorage is vulnerable to XSS"
    severity: WARNING
    languages: [javascript, typescript]

  # ===== Common Security Issues =====

  # Weak cryptography
  - id: weak-cryptography.md5
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: crypto.createHash('md5', ...)
    message: "MD5 is a weak hash algorithm - use SHA-256 or better"
    severity: WARNING
    languages: [python, javascript, typescript]
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"

  # Weak random
  - id: weak-random.random
    pattern-either:
      - pattern: random.random(...)
      - pattern: Math.random()
    message: "Weak random generator - use secrets.token_hex() or crypto.randomBytes() for security"
    severity: WARNING
    languages: [python, javascript, typescript]

  # Tempfile issues
  - id: python.insecure-tempfile
    pattern-either:
      - pattern: mktemp(...)
      - pattern: tempfile.mktemp(...)
    message: "Insecure temporary file creation - use tempfile.mkstemp() instead"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-377: Insecure Temporary File"

# Exclude paths from scanning (passed via CLI --exclude or .semgrepignore)
# Semgrep OSS does not support top-level "extends" or "exclude" keys in rules files.
# Use: semgrep --config semgrep.yml --exclude "node_modules,venv,.venv,.next,dist,build,coverage"
# Or create a .semgrepignore file for persistent exclusions.
