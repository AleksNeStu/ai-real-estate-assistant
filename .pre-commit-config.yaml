repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # Re-pinned from v6.0.0 (F-20260925-9): upstream restructured and removed
    # `.pre-commit-hooks.yaml` manifest; v5.0.0 is the last rev with it.
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        # The demo clip is a published material: a six-second MP4 and the GIF
        # the README inlines. They are binaries on purpose, not build residue.
        # The same clip is served to the web app from apps/web/public/clips,
        # and the design reference's screenshots live in assets/design - both
        # are published materials as well.
        exclude: ^apps/api/docs/api/openapi\.json$|^assets/clips/|^apps/web/public/clips/|^assets/design/
      - id: check-illegal-windows-names

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Gitleaks - Secret scanning (API keys, passwords, tokens)
  # Install: scoop install gitleaks (Windows) or brew install gitleaks (macOS)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # The keyword detector fires on UI words ("password", "token") that appear
        # in the 9 translation catalogues - a false positive per locale, per line.
        # Gitleaks (above) still scans these files with pattern-based rules.
        exclude: ^apps/web/messages/.*\.json$

  # Semgrep - SAST (Static Application Security Testing)
  # NOTE: Runs only on pre-push to avoid slowing down frequent commits.
  # Requires: pip install semgrep (Linux/macOS) or Docker (Windows)
  - repo: local
    hooks:
      - id: semgrep-sast
        name: semgrep SAST (error-only)
        entry: semgrep --config semgrep.yml --error --severity ERROR --quiet
        language: system
        files: \.(py|js|ts|tsx|jsx)$
        pass_filenames: true
        stages: [pre-push]

  # lint-staged hook REMOVED 2026-10-19 (Phase C.6 of session plan):
  # the previous ``npx lint-staged`` entry pointed at a ``lint-staged``
  # block in ``apps/web/package.json`` which never existed. The hook
  # ran as a no-op (``pass_filenames: false`` masked the failure).
  # If/when lint-staged is reintroduced, add the config block to
  # apps/web/package.json FIRST, then re-enable the local hook here.
