version: 2

updates:
  # Frontend (npm) — version + security updates
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps-web)

  # Backend (pip) — version + security updates
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps-api)

  # Root monorepo tooling (npm) — version + security updates.
  # Required so advisories in root-lockfile deps (e.g. @humanfs/node)
  # auto-open PRs instead of sitting in the dashboard forever.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - monorepo
    commit-message:
      prefix: chore(deps)

  # GitHub Actions — version + security updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci-deps)
