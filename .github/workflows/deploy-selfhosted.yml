name: Deploy to a self-hosted server

# A second deployment target, next to the platform-hosted one: this workflow
# rolls a server YOU control onto the images this repository publishes.
#
# It is deliberately generic. Nothing about any particular host, port, user or
# path is written here - every one of them arrives through the repository
# secrets, so the same file works for a fork, a customer, or a teammate.
#
# The credentials it needs (Settings -> Secrets -> Actions):
#
#   DEPLOY_SSH_KEY          private key of the deploy user (PEM, no passphrase)
#   DEPLOY_HOST             hostname or IP of the server
#   DEPLOY_USER             the user to connect as
#   DEPLOY_PORT             SSH port (optional, default 22)
#   DEPLOY_PATH             directory on the server that holds the deployment
#   DEPLOY_COMPOSE_FILE     compose file in that directory (optional,
#                            default docker-compose.selfhosted.yml)
#   DEPLOY_HEALTH_URL       URL that answers 200 once the stack is up
#                            (optional - use an internal address, it must not
#                            carry a token: it travels in the command line)
#   DEPLOY_SSH_KNOWN_HOSTS  the server's host key (optional, pins the host)
#
# The server keeps its own configuration. The workflow only replaces the
# images and restarts the stack:
#
#   <DEPLOY_PATH>/docker-compose.selfhosted.yml   the stack
#   <DEPLOY_PATH>/.env                            the access key, the JWT secret
#                                                 and the pepper
#
# The .env never leaves the server and never enters this repository.

on:
  # A release tag means "the images for this version now exist" - publish them,
  # then roll the server onto them.
  push:
    tags:
      - "v*"

  # Manual roll-out, e.g. to move the server onto a specific version.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 5.1.7). Empty = the tag of this release."
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-selfhosted-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    # Which commit is this roll-out about?
    #
    # The trigger and the subject are not the same thing. On a tag push they
    # coincide - GITHUB_REF_NAME is `v5.3.0` and the commit is the one that
    # tag points at. On a manual roll-out they do NOT: the workflow runs on
    # whatever branch it was dispatched from, so GITHUB_SHA is the tip of
    # THAT branch, while the images being rolled out were built from the
    # commit the NAMED tag points at. Reading the tip would gate the roll on
    # the wrong commit's CI, and wait for a publish run that does not exist
    # (the publish workflow starts on a tag, never on a branch).
    #
    # So the subject is resolved from the tag itself. An annotated tag is
    # peeled to its commit; a lightweight tag is already the commit.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve the tag to the commit behind it
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          raw="$RAW_TAG"
          if [ -z "$raw" ]; then
            raw="${GITHUB_REF_NAME}"
          fi
          tag="${raw#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolving the tag v$tag to its commit"

          SHA=""
          for name in "v$tag" "$tag"; do
            REF=$(gh api "repos/${{ github.repository }}/git/ref/tags/$name" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)
            # A missing ref answers with a JSON error, not with a type and a
            # SHA. Only a well-formed answer is a reference.
            case "$REF" in
              commit\ *|tag\ *) ;;
              *) continue ;;
            esac
            TYPE=${REF%% *}
            OBJ=${REF##* }
            if [ "$TYPE" = "tag" ]; then
              # An annotated tag points at a tag object, which points at the
              # commit. Peel it.
              SHA=$(gh api "repos/${{ github.repository }}/git/tags/$OBJ" --jq '.object.sha' 2>/dev/null || true)
            else
              SHA="$OBJ"
            fi
            if [ -n "$SHA" ]; then
              break
            fi
          done

          if [ -z "$SHA" ]; then
            # No tag to resolve: this is a roll-out of a tag that was never
            # pushed, so the branch tip is the only thing left to name. The
            # gate below then judges that commit, and the publish wait
            # below reports that there is nothing to wait for.
            SHA="${{ github.sha }}"
            echo "the tag v$tag does not exist - falling back to this workflow's commit"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "the release for tag $tag is commit $SHA"

  ci-check:
    # THE GATE. A tag is a trigger, not a verdict: a `v*` tag starts the
    # publish and the roll even when the commit behind it never went through
    # CI. This job is the gate, and it answers one question: has THIS code
    # passed CI?
    #
    # Three answers exist.
    #
    # 1. The commit has its own CI run. Its conclusion is the answer - green
    #    passes, red blocks, and a run that is still running is waited for.
    # 2. The commit has no CI run at all, because CI ignores the documentation
    #    and this commit touched only the documentation. Then the verdict is
    #    the one of the last commit whose CODE is the same: the trees are
    #    compared, and an identical tree means identical code, so the earlier
    #    verdict carries over.
    # 3. The commit has no CI run and its code differs from the last commit
    #    that passed. Nothing is published. This is the fail-closed case, and
    #    it is the reason the gate exists.
    #
    # The rule "CI green before a tag" was the operator's to keep by hand,
    # because the tag-driven workflows carried no gate of their own.
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          GRACE=10   # minutes a CI run is given to appear at all
          for attempt in $(seq 1 60); do
            RAW=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=20" 2>/dev/null || true)
            # The PUSH run is the one that proves the commit itself. A pull
            # request run covers the same commit through a different event,
            # and the release line follows the push.
            RUNS=$(echo "$RAW" | jq -c '[.workflow_runs[]? | select(.event == "push")]' 2>/dev/null || echo '[]')
            COUNT=$(echo "$RUNS" | jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              DONE=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length' 2>/dev/null || echo 0)
              if [ "$DONE" -gt 0 ]; then
                OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
                if [ "$OK" -gt 0 ]; then
                  echo "CI passed for $HEAD_SHA - the publish may continue"
                  exit 0
                fi
                echo "ERROR: the CI of $HEAD_SHA did not succeed ($(echo "$RUNS" | jq -r 'map(.conclusion) | join(",")')) - nothing is published" >&2
                exit 1
              fi
              echo "the CI of $HEAD_SHA is still running (attempt $attempt/60), waiting 30s"
            elif [ "$attempt" -lt "$GRACE" ]; then
              # No run yet. A run that is about to start is still this
              # commit's own run, so it is given a grace period to appear.
              echo "no CI run for $HEAD_SHA yet (attempt $attempt/60), waiting 30s"
            else
              # No run, and none is coming: CI ignores the documentation, so
              # this commit changed nothing CI runs on. The verdict is the one
              # of the last commit whose code is the same - the trees are
              # compared.
              TREE=$(gh api "repos/${{ github.repository }}/git/commits/$HEAD_SHA" --jq .tree.sha 2>/dev/null || echo "")
              LAST=$(gh api -H "Accept: application/vnd.github+json" \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&event=push&per_page=20" \
                | jq -r '[.workflow_runs[]? | select(.event == "push" and .conclusion == "success")] | sort_by(.run_number) | reverse | .[0].head_sha' 2>/dev/null || echo "")
              if [ -n "$TREE" ] && [ -n "$LAST" ]; then
                LAST_TREE=$(gh api "repos/${{ github.repository }}/git/commits/$LAST" --jq .tree.sha 2>/dev/null || echo "")
                if [ -n "$LAST_TREE" ] && [ "$TREE" = "$LAST_TREE" ]; then
                  echo "no CI run for $HEAD_SHA, but its code is identical to $LAST, which passed CI - the publish may continue"
                  exit 0
                fi
                echo "ERROR: no CI run for $HEAD_SHA, and its code differs from the last commit that passed CI ($LAST) - nothing is published" >&2
                exit 1
              fi
              echo "ERROR: no CI run for $HEAD_SHA and no CI verdict to inherit - nothing is published" >&2
              exit 1
            fi
            sleep 30
          done
          echo "ERROR: the CI of $HEAD_SHA did not settle in 30 minutes - nothing is published" >&2
          exit 1

  deploy:
    # Only the owner of this repository deploys. Whether a target server is
    # configured at all is a SECRET question, and a secret cannot be read in
    # a job-level condition - the first step below settles it instead.
    needs: [resolve, ci-check]
    if: github.repository_owner == 'AleksNeStu'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || 'docker-compose.selfhosted.yml' }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
    steps:
      - name: Check the deployment target
        id: target
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "No deployment target is configured in this repository - nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Resolve the image tag
        id: tag
        if: steps.target.outputs.configured == 'true'
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $tag"

      - name: Wait for the images to be published
        if: steps.target.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -uo pipefail
          # The images are published by the release workflow, which runs in
          # PARALLEL with this one. The pull below can therefore fail for a
          # while before the tag exists.
          #
          # A blind window is the wrong shape for that: a multi-architecture
          # build of the frontend takes longer than twenty minutes, and this
          # workflow used to give up at exactly twenty. The deploy then had
          # to be repeated by hand, and a release that ends in a manual step
          # is a release that can be forgotten.
          #
          # So the wait is for the PUBLISH's VERDICT, not for a span of
          # time. The publish run for this commit is read from the API and
          # waited for: green means the images exist and the pull below
          # succeeds, red means the release itself failed and there is
          # nothing to roll out.
          #
          # The window is still bounded - two hours - because a publish that
          # never settles must not hold a runner forever.
          PUBLISHED=0
          for attempt in $(seq 1 240); do
            RAW=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/publish-ghcr.yml/runs?head_sha=$HEAD_SHA&per_page=20" 2>/dev/null || echo '{"workflow_runs":[]}')
            RUNS=$(echo "$RAW" | jq -c '[.workflow_runs[]? | select(.event == "push")]' 2>/dev/null || echo '[]')
            COUNT=$(echo "$RUNS" | jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              DONE=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length' 2>/dev/null || echo 0)
              if [ "$DONE" -gt 0 ]; then
                OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
                if [ "$OK" -gt 0 ]; then
                  echo "the images for tag $IMAGE_TAG are published"
                  PUBLISHED=1
                  break
                fi
                echo "ERROR: the publish of $HEAD_SHA did not succeed ($(echo "$RUNS" | jq -r 'map(.conclusion) | join(",")')) - nothing is rolled out" >&2
                exit 1
              fi
              echo "the publish of $HEAD_SHA is still running (attempt $attempt/240), waiting 30s"
            else
              echo "no publish run for $HEAD_SHA yet (attempt $attempt/240), waiting 30s"
            fi
            sleep 30
          done
          if [ "$PUBLISHED" -ne 1 ]; then
            echo "ERROR: the publish of $HEAD_SHA did not settle in two hours - nothing is rolled out" >&2
            exit 1
          fi

      - name: Prepare the SSH key
        if: steps.target.outputs.configured == 'true'
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" 'echo "ssh ok"'

      - name: Deliver the privileged list and the deployment's identity
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_RUN_ID: ${{ github.run_id }}
          BUILD_REPO: ${{ github.repository }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          ADMIN_IPS: ${{ vars.ADMIN_IPS }}
        run: |
          set -euo pipefail
          # The privileged list and the deployment's identity travel to the
          # server as a FILE, over stdin: `cat > build.env`. They are not
          # credentials, but they are personal data, and a process list on the
          # server is not the place for an e-mail address. The image's own
          # labels - the commit and the build time - are added on the server
          # in the next step, because the image is what knows them.
          {
            printf 'DEPLOY_RUN_ID=%s\n' "$DEPLOY_RUN_ID"
            printf 'BUILD_REPO=%s\n' "$BUILD_REPO"
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
            printf 'ADMIN_IPS=%s\n' "$ADMIN_IPS"
          } > "$RUNNER_TEMP/build.env"

          # The file lands in the DEPLOY USER's own home, not in the
          # deployment directory. The deployment directory is usually owned by
          # another account - the deploy user reads the compose file and the
          # .env next to it, but cannot write into the directory, and the
          # delivery died there with "Permission denied". The home is the
          # deploy user's own, and the file is mode 600: it carries an
          # e-mail address and a list of addresses.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077; cat > \"\$HOME/.aire-build.env\"" < "$RUNNER_TEMP/build.env"

          rm -f "$RUNNER_TEMP/build.env"

      - name: Roll the stack onto the new images
        if: steps.target.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          # The variables travel as the remote command's environment; the
          # script itself arrives over stdin. None of them is a credential -
          # a path, a tag, an image repository and a health URL.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' COMPOSE_FILE='$DEPLOY_COMPOSE_FILE' \
               IMAGE_TAG='$IMAGE_TAG' IMAGE_REPO='$IMAGE_REPO' \
               DEPLOY_HEALTH_URL='$DEPLOY_HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export AIRE_IMAGE_TAG="$IMAGE_TAG"
          export AIRE_IMAGE_REPO="$IMAGE_REPO"

          # The delivered file: the privileged list and the deployment's
          # identity, written by the step above into the deploy user's home.
          BUILD_ENV_FILE="$HOME/.aire-build.env"
          if [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "the delivered file $BUILD_ENV_FILE is missing" >&2
            exit 1
          fi

          # The images are published by the release workflow, which runs in
          # parallel with this one. The step above waited for that publish to
          # finish, so the tag exists by now - but the registry still needs a
          # moment to serve it, so the pull retries. Only a failure a retry
          # cannot fix stops at once: a file the deploy user may not read, a
          # compose file that is not there. A tag that is not published YET
          # says "failed to resolve reference" and is exactly what this loop
          # waits for.
          #
          # The window is 20 attempts of 30 seconds - ten minutes. It is
          # short on purpose: the publish is already green, so a tag that is
          # still missing after ten minutes is a registry that is not serving
          # it, and waiting longer only delays the report of that.
          pulled=0
          for attempt in $(seq 1 20); do
            if docker compose -f "$COMPOSE_FILE" pull 2>&1 | tee /tmp/aire-pull.log; then
              pulled=1
              break
            fi
            if grep -qiE "permission denied|no such file" /tmp/aire-pull.log; then
              echo "the pull failed for a reason a retry cannot fix" >&2
              exit 1
            fi
            echo "the registry does not serve the image yet (attempt $attempt/20), waiting 30s"
            sleep 30
          done
          if [ "$pulled" -ne 1 ]; then
            echo "the images for tag $IMAGE_TAG never became available" >&2
            exit 1
          fi

          # The commit and the build time are the IMAGE's own labels, so they
          # are true of the build being rolled out even when this roll is a
          # manual one onto an older tag. The image is read by its reference -
          # the one that was just pulled - and NOT through `docker compose
          # images`, which would answer with the image of the container that
          # is still running, and therefore with the PREVIOUS build.
          BACKEND_REF=$(docker compose -f "$COMPOSE_FILE" config --images 2>/dev/null | grep '/backend:' | head -1 || true)
          if [ -n "$BACKEND_REF" ]; then
            printf 'BUILD_SHA=%s\n' "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BACKEND_REF" 2>/dev/null || true)" >> "$BUILD_ENV_FILE"
            printf 'BUILD_AT=%s\n' "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "$BACKEND_REF" 2>/dev/null || true)" >> "$BUILD_ENV_FILE"
          fi

          # The environment the containers read: the privileged list and the
          # build metadata, both delivered by this deploy. The compose file
          # interpolates them into the containers' environment.
          set -a
          . "$BUILD_ENV_FILE"
          set +a

          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

          if [ -n "$DEPLOY_HEALTH_URL" ]; then
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 10 "$DEPLOY_HEALTH_URL"; then
                echo "the stack answers at $DEPLOY_HEALTH_URL"
                exit 0
              fi
              echo "waiting for the stack to answer (attempt $attempt/30)"
              sleep 10
            done
            echo "the stack did not become healthy at $DEPLOY_HEALTH_URL" >&2
            docker compose -f "$COMPOSE_FILE" ps >&2 || true
            exit 1
          fi
          REMOTE

      - name: Summary
        if: steps.target.outputs.configured == 'true'
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- image tag: \`${{ steps.tag.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- images: \`$IMAGE_REPO\`" >> "$GITHUB_STEP_SUMMARY"
