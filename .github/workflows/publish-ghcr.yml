name: Publish Docker Images to GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  ci-check:
    # THE GATE. A tag is a trigger, not a verdict: a `v*` tag starts the
    # publish even when the commit behind it never went through CI. This job
    # is the gate - the tagged commit must carry a SUCCESSFUL CI run, or
    # nothing is published.
    #
    # The rule "CI green before a tag" was the operator's to keep by hand,
    # because the tag-driven workflows carried no gate of their own. Here it
    # is the workflow's own job, and it fails closed: a commit with no CI run
    # is not published.
    #
    # The commit is waited for, not merely read: a tag cut while the CI of
    # that commit is still running must not publish a half-checked build, and
    # must not fail either - it waits, up to thirty minutes.
    runs-on: ubuntu-latest
    steps:
      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            RAW=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=20" 2>/dev/null || true)
            # The PUSH run is the one that proves the commit itself. A pull
            # request run covers the same commit through a different event,
            # and the release line follows the push.
            RUNS=$(echo "$RAW" | jq -c '[.workflow_runs[]? | select(.event == "push")]' 2>/dev/null || echo '[]')
            COUNT=$(echo "$RUNS" | jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              DONE=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length' 2>/dev/null || echo 0)
              if [ "$DONE" -gt 0 ]; then
                OK=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
                if [ "$OK" -gt 0 ]; then
                  echo "CI passed for $HEAD_SHA - the images may be published"
                  exit 0
                fi
                echo "ERROR: the CI of $HEAD_SHA did not succeed ($(echo "$RUNS" | jq -r 'map(.conclusion) | join(",")')) - nothing is published" >&2
                exit 1
              fi
              echo "the CI of $HEAD_SHA is still running (attempt $attempt/60), waiting 30s"
            else
              echo "no CI run for $HEAD_SHA yet (attempt $attempt/60), waiting 30s"
            fi
            sleep 30
          done
          echo "ERROR: the CI of $HEAD_SHA did not settle in 30 minutes - nothing is published" >&2
          exit 1

  publish-backend:
    needs: ci-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Catches unsatisfiable Python constraints (e.g. the v5.0.6
      # protobuf-vs-google-generativeai conflict) before the slow
      # buildx step wastes 3+ minutes. See commit 245885a for context.
      - name: Check Python dependencies resolve
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            # Match the project's 4-part version convention (e.g. v5.1.5.1, v5.1.5.2)
            # by capturing everything after `v` as a raw tag — docker/metadata-action's
            # `type=semver` rejects anything that isn't strict X.Y.Z semver, but this
            # project uses 4-part (X.Y.Z.W) versions. See CHANGELOG.md release history.
            type=match,pattern=v(.*),group=1
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container smoke test: catch runtime import errors that pip
      # resolution and `uv pip install` cannot detect. The v5.0.6
      # image shipped with a broken `from langchain_community.chat_models
      # import ChatOllama` — pip installed cleanly but the container
      # crashed at startup. This step starts the image, hits /health,
      # and tears it down. ~10s of CI time. See commits 9ea5a7e
      # (v5.0.6) and the follow-up v5.0.7.
      - name: Smoke-test backend image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker rm -f smoke-backend 2>/dev/null || true
          docker run -d --name smoke-backend \
            -e ENVIRONMENT=development \
            -e API_ACCESS_KEY=dev-secret-key \
            -e AUTH_JWT_ENABLED=false \
            -e CACHE_ENABLED=false \
            -e METRICS_ENABLED=false \
            -e API_RATE_LIMIT_ENABLED=false \
            -e CORS_ALLOW_ORIGINS=* \
            -e INTERNET_ENABLED=false \
            -e DEFAULT_PROVIDER=openai \
            -e DEMO_MODE=true \
            -e UPTIME_MONITOR_ENABLED=false \
            -e SMTP_PROVIDER=disabled \
            -e DATABASE_URL=sqlite+aiosqlite:///./data/smoke.db \
            -e SEED_ON_STARTUP=false \
            "$IMAGE"
          # Container HEALTHCHECK polls /health every 30s; force a faster check.
          for i in $(seq 1 20); do
            sleep 2
            code=$(docker exec smoke-backend curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then
              echo "smoke-test PASSED: /health returned 200 after ${i}x2s"
              docker rm -f smoke-backend >/dev/null
              exit 0
            fi
          done
          echo "smoke-test FAILED: /health never returned 200 in 40s" >&2
          docker logs smoke-backend >&2 || true
          docker rm -f smoke-backend >/dev/null
          exit 1

  publish-frontend:
    needs: ci-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            # See note in publish-backend job above re 4-part version convention.
            type=match,pattern=v(.*),group=1
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # The public address of the deployment is baked into the bundle at
          # build time (Next inlines NEXT_PUBLIC_*). It comes from the
          # repository variable SITE_URL, so changing the address is one
          # setting and one release - not an edit in the source tree.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
