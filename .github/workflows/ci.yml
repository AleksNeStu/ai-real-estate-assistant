name: CI/CD AI Real Estate Assistant

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      enable_deep_analysis:
        description: 'Enable Stage 4 deep analysis (CodeQL, Trivy, Lighthouse, E2E)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' }}

# Condition: skip Stage 4 on Dependabot PRs (dependency-only changes)
# Condition: Stage 4 on dev/main pushes or manual dispatch
jobs:
  # ===== STAGE 1: Quick Checks =====

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  secret-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for placeholder secrets in deploy configs
        run: |
          echo "Checking for placeholder secrets in deploy configuration..."

          PATTERNS=(
            "your-generated-api-key-here"
            "your-jwt-secret-key-here"
            "change-me"
            "changeme"
          )

          EXIT_CODE=0

          for pattern in "${PATTERNS[@]}"; do
            if grep -r "$pattern" deploy/ 2>/dev/null; then
              echo "::error::Found placeholder '$pattern' in deploy config"
              EXIT_CODE=1
            fi
          done

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No placeholder secrets found in deploy configs"
          fi

          exit $EXIT_CODE

  rule5-protected-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify canonical gitignored paths are not tracked (CLAUDE.md Rule 5)
        run: |
          set -e
          echo "Running Rule 5 guard: .mcp.json, .env, .env.local, .env.ports must be untracked."
          python scripts/rule5_guard/gitignored_tracked_check.py --verbose

  backend-lint:
    runs-on: ubuntu-latest
    needs: [gitleaks, secret-validation]
    defaults:
      run:
        working-directory: apps/api
    # The type check adds a full 727-file pass on top of ruff, so the job
    # needs more room than the lint alone.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          # The gate tooling comes from requirements-dev.txt, where every
          # version is pinned: a floating mypy resolves a different major and
          # reports a different set of errors than the local gate, and a
          # floating ruff changes what the lint rejects. The file is separate
          # from requirements.txt because that one ships into the runtime
          # image, and the image does not need a type checker.
          dev-requirements-file: requirements-dev.txt

      # The two steps below carry their own working-directory, even though the
      # job default already names apps/api. The reason: a local gate that
      # parses this workflow resolves a step-level working-directory, and a
      # job-level default is invisible to it - so the command would run in the
      # repository root, where there is no ruff configuration and no
      # [tool.mypy], and lint a tree it was never meant to lint. The value is
      # the same one the job default names, so what GitHub Actions runs does
      # not change.
      - name: Lint (ruff)
        working-directory: ./apps/api
        run: |
          python -m ruff check .

      # The type check is a GATE, not a warning. It reads [tool.mypy] from
      # apps/api/pyproject.toml (pydantic plugin included) and is the same
      # invocation the local CI-parity gate runs.
      - name: Type check (mypy)
        working-directory: ./apps/api
        run: |
          python -m mypy .

  # ===== STAGE 2: Backend Tests (Parallel Matrix) =====

  backend-tests:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          # The floors are the coverage this codebase reaches today, measured
          # on the suites themselves: 85.5% for the unit suite and 52.0% for
          # the integration suite. The 85 / 70 that stood here were never
          # applied - the check ended in an `|| echo` that swallowed the
          # failure - so they were decoration. These are real.
          - name: unit
            path: tests/unit
            coverage-min: 84
          - name: integration
            path: tests/integration
            coverage-min: 50

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          # The test tooling is pinned in requirements-dev.txt for the same
          # reason as in the lint job: a floating plugin version can fail a
          # suite that passed the day before. httpx and types-requests are
          # part of the runtime manifest (requirements.txt).
          dev-requirements-file: requirements-dev.txt

      - name: Run ${{ matrix.test-suite.name }} tests
        timeout-minutes: 15
        run: |
          python -m pytest ${{ matrix.test-suite.path }} \
            -n auto --dist=worksteal \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --timeout=${{ matrix.test-suite.name == 'integration' && '120' || '180' }} \
            --tb=short \
            -v

      - name: Check coverage threshold
        if: success()
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100)")
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=${{ matrix.test-suite.coverage-min }}
          # The check has to be able to FAIL. It used to end in
          # `|| echo "::error::..."`, and the echo swallowed the exit code of
          # the python: the thresholds (85 / 70) were printed and never
          # applied. The numbers below are the coverage this codebase
          # actually reaches - measured, not wished for - and they are a
          # ratchet: every release that raises the coverage raises them
          # here. The per-change ratchet is scripts/ci/ci_parity.py, which
          # holds the coverage of the files a change touches.
          if ! python -c "import sys; sys.exit(0 if float('${COVERAGE}') >= ${THRESHOLD} else 1)"; then
            echo "::error::Coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.test-suite.name }}
          path: apps/api/coverage.xml

  api-contract:
    # The public API is a promise. This job compares the schema the
    # application serves with the baseline that was released, and fails on a
    # difference a consumer cannot survive: a field that is gone, renamed,
    # retyped or newly required, an endpoint or a parameter that disappeared.
    # An additive change passes - a consumer that does not know the new field
    # ignores it.
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          dev-requirements-file: requirements-dev.txt

      # The schema comes from the application itself, so the contract that is
      # checked is the one this commit serves - not a snapshot that can go
      # stale.
      - name: Export the OpenAPI schema
        run: python scripts/docs/export_openapi.py

      - name: Check the API contract for breaking changes
        run: python scripts/api/openapi_diff.py --current docs/api/openapi.json

  cli-tests:
    # The open command-line client. Its types are generated from the
    # published contract, and this job is what proves they still match it:
    # the test regenerates them and fails when the committed copy differs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and test the client
        run: npm test

  backend-e2e:
    # The backend's own end-to-end suite: the real application, the real
    # middleware stack, the real auth contract - request to response.
    #
    # It runs in-process. The application under test is the one in this
    # checkout, and the two things that would leave the runner (the LLM and
    # the vector store) are replaced at their boundary, so the suite needs
    # no server, no key and no network. The same suite runs against the
    # real stack in the compose-stack job below - this run is the one that
    # asserts the contract the demo stack cannot: the API key.
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          dev-requirements-file: requirements-dev.txt

      - name: Backend E2E (in-process)
        run: python -m pytest tests/e2e_backend -v --tb=short

  backend-resilience:
    # The degradation and the fallback: a fake provider that fails, and the
    # answer the caller gets. The failing provider is local, so the proof
    # costs no key, spends no token and never touches an outage.
    runs-on: ubuntu-latest
    needs: [backend-lint]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          dev-requirements-file: requirements-dev.txt

      - name: Resilience and fallback
        run: python -m pytest tests/resilience -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    needs: [gitleaks, secret-validation]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The type check is a gate, not a report. It was never part of CI, so
      # a type error could reach a release - and the release path publishes
      # on a tag without asking anything of the commit. Now the commit's CI
      # carries the type check, and the tag path gates on that CI.
      - name: Type check (tsc)
        run: npm run typecheck

  security-sast:
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install security tools
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          # bandit is pinned in requirements.txt; the explicit pin here keeps
          # the tool itself from floating even if the manifest changes.
          install-extras: 'bandit==1.9.4'

      - name: Run Bandit (exclude tests, fail on high severity)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m bandit -r apps/api -x tests,node_modules,.history,venv,venv/*,.venv,.venv/*,.venv_ci,.venv_ci/* --severity-level high --confidence-level high -f json -o artifacts/bandit.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: artifacts/bandit.json

  # ===== STAGE 3: Quality Checks =====

  frontend-tests:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (block on high/critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci

      - name: Frontend coverage summary
        run: |
          node -e 'const fs=require("fs"); const summary=JSON.parse(fs.readFileSync("coverage/coverage-summary.json","utf8")); const total=summary.total; const text=["### Frontend Coverage","","Lines: "+total.lines.pct+"%","Statements: "+total.statements.pct+"%","Functions: "+total.functions.pct+"%","Branches: "+total.branches.pct+"%",""].join("\n"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);'

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/web/coverage

  security-deps:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pip-audit
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          # pip-audit is pinned in requirements.txt; the explicit pin here
          # keeps the auditor itself from floating.
          install-extras: 'pip-audit==2.10.1'

      - name: Run pip-audit (fail on vulnerabilities)
        continue-on-error: true
        run: |
          mkdir -p ../../artifacts
          python -m pip_audit -r requirements.lock.txt -f json -o ../../artifacts/pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: artifacts/pip-audit.json

  # ===== STAGE 4: Deep Analysis (main/dev or manual, skip Dependabot) =====

  codeql-python:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')) }}
    needs: [backend-lint]
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  codeql-javascript:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')) }}
    needs: [backend-lint]
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  container-scan:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')) }}
    needs: [frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend image
        run: |
          docker build -f deploy/docker/Dockerfile.backend -t ai-backend:ci .

      - name: Build frontend image
        run: |
          docker build -f deploy/docker/Dockerfile.frontend -t ai-frontend:ci .

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-backend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-frontend:ci
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  lighthouse:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')) }}
    needs: [frontend-tests]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          LHCI_AUTH_BYPASS: 'true'
          NEXT_PUBLIC_API_URL: /api/v1

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_AUTH_BYPASS: 'true'

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: apps/web/.lighthouseci

      - name: Lighthouse summary
        if: always()
        run: |
          echo "### Lighthouse CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d .lighthouseci ]; then
            ls -1 .lighthouseci/*.html 2>/dev/null | while read f; do
              echo "- Report: $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            done
          fi

  e2e:
    # Pinned to ubuntu-24.04: the ubuntu-latest image migrated to Ubuntu 26.04
    # (runner-images#14748) and Playwright 1.57 has no chromium build for
    # ubuntu26.04-x64, so `npx playwright install` (the root `prepare` script,
    # run by `npm ci`) fails with
    # "Playwright does not support chromium on ubuntu26.04-x64".
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.enable_deep_analysis == 'true')) }}
    needs: [frontend-build]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node (root)
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

      - name: Start frontend server
        run: |
          cd apps/web && npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        run: |
          set -uo pipefail
          # The browser binary comes from the Playwright CDN, and the root
          # "prepare" script (npx playwright install) already fetched it
          # during npm ci. What this step used to add was the SYSTEM
          # packages, fetched over apt from the Ubuntu archives - and a
          # runner whose resolver cannot reach azure.archive.ubuntu.com
          # spent the whole twenty-five minutes of the job failing there,
          # twice, before the job timed out. That is the runner's network,
          # not the project.
          #
          # The runner image already carries the libraries chromium needs
          # (it ships Chrome); a missing one fails loudly in the test run
          # itself, naming it. What is left is the CDN, and a dropped
          # connection there is worth a second try.
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              echo "the browser is in place"
              exit 0
            fi
            echo "the download failed (attempt $attempt/3), retrying in 30s" >&2
            sleep 30
          done
          echo "ERROR: the browser could not be downloaded after three attempts" >&2
          exit 1

      - name: Run E2E tests
        env:
          CI: 'true'
          PLAYWRIGHT_START_WEB: 'false'
        run: npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: artifacts/e2e-report/

      - name: Upload E2E output (screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: artifacts/e2e-output/

      - name: E2E summary
        if: always()
        run: |
          echo "### E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/e2e-report/results.json ]; then
            PASSED=$(python3 -c "import json; d=json.load(open('artifacts/e2e-report/results.json')); print(d.get('stats',{}).get('passed',0))")
            FAILED=$(python3 -c "import json; d=json.load(open('artifacts/e2e-report/results.json')); print(d.get('stats',{}).get('failed',0))")
            TOTAL=$(python3 -c "import json; d=json.load(open('artifacts/e2e-report/results.json')); print(d.get('stats',{}).get('total',0))")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results.json found" >> $GITHUB_STEP_SUMMARY
          fi

      # The accessibility gate: axe-core over every route of the assembled
      # application, at WCAG 2.2 A/AA. It runs inside this job - the browser
      # and the built application are already here - and a violation fails
      # the job, so the pipeline goes red with it. The summary names the
      # result, because a gate nobody can see is a gate nobody trusts.
      - name: Accessibility summary
        if: always()
        run: |
          echo "### Accessibility (axe-core, WCAG 2.2 A/AA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/e2e-report/results.json ]; then
            node -e '
              const report = require("./artifacts/e2e-report/results.json");
              const rows = [];
              const walk = (suite) => {
                for (const spec of suite.specs || []) {
                  if (!(spec.file || "").includes("accessibility")) continue;
                  for (const test of spec.tests || []) {
                    rows.push([spec.title, test.status]);
                    for (const result of test.results || []) {
                      for (const error of result.errors || []) {
                        console.log("- FAILED " + spec.title + ": " + String(error.message || "").slice(0, 900));
                      }
                    }
                  }
                }
                for (const child of suite.suites || []) walk(child);
              };
              for (const suite of report.suites || []) walk(suite);
              const passed = rows.filter(([, s]) => s === "expected" || s === "passed").length;
              const failed = rows.filter(([, s]) => s !== "expected" && s !== "passed" && s !== "skipped").length;
              const skipped = rows.filter(([, s]) => s === "skipped").length;
              console.log("| Route | Result |");
              console.log("|---|---|");
              for (const [title, status] of rows) console.log("| " + title + " | " + status + " |");
              console.log("");
              console.log("Routes scanned: " + rows.length + " | passed: " + passed + " | failed: " + failed + " | skipped: " + skipped);
            ' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results.json found" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== STAGE 5: Integration =====

  # The stack job: it builds the Docker Compose stack, checks that it comes
  # up, and runs the e2e suite against the REAL backend - the only job in the
  # pipeline where the API is not mocked. A stack that does not come up fails
  # the pipeline (no continue-on-error): a green pipeline has to mean that
  # the product starts.
  compose-stack:
    # Pinned to ubuntu-24.04 for the same reason as the e2e job: the
    # ubuntu-latest image has no chromium build for Playwright.
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend-build]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              echo "the browser is in place"
              exit 0
            fi
            echo "the download failed (attempt $attempt/3), retrying in 30s" >&2
            sleep 30
          done
          echo "ERROR: the browser could not be downloaded after three attempts" >&2
          exit 1

      - name: Prepare the stack's mounted directories
        env:
          # Compose interpolates the whole file, and the postgres service
          # requires this variable - the service itself never starts here.
          POSTGRES_PASSWORD: ci-profile-not-started # pragma: allowlist secret - a throwaway value for a service that never starts
        run: |
          # The backend runs as a non-root user and writes into the host
          # directories the compose file mounts: the audit log at import time,
          # the sessions and the preferences when they are used. On a runner
          # those paths are not part of the checkout, so Docker creates them
          # as root - and the container cannot write there, which killed the
          # backend before it served anything ("Permission denied:
          # 'data/audit/audit_<date>.csv'"). The paths are read from the
          # compose file itself, so this list cannot drift from it.
          docker compose -f deploy/compose/docker-compose.yml config --format json \
            | jq -r '.services | to_entries[] | .key as $s | (.value.volumes // [])[] | select(.type == "bind") | .source' \
            | while read -r dir; do
                mkdir -p "$dir"
                chmod -R 0777 "$dir"
              done
          ls -ld deploy/compose/data/audit

      - name: Docker Compose stack (build + health checks)
        env:
          API_ACCESS_KEY: ci-test-key
          # The postgres service sits behind a profile and never starts here,
          # but Compose interpolates the whole file - without the variable the
          # stack refuses to come up at all.
          POSTGRES_PASSWORD: ci-profile-not-started # pragma: allowlist secret - a throwaway value for a service that never starts
          # The provider is mocked (the local MockLLM), so the pipeline needs
          # no paid API key and no answer leaves the runner.
          DEMO_MODE: 'true'
          # The demo catalogue is seeded when the backend starts, and the map
          # of the public demo draws it - so the stack needs it.
          DEMO_DATA_MODE: 'true'
          DEMO_LLM_MODE: 'true'
          DEMO_API_KEY_BYPASS: 'true' # pragma: allowlist secret - a flag, not a credential
          # The stack talks to itself: the browser's preflight is checked
          # against the stack's own origins. Without the list the preflight is
          # rejected ("Disallowed CORS origin"), and the suite that runs
          # against the real stack asserts it.
          CORS_ALLOW_ORIGINS: http://localhost:3082,http://localhost:8082
          # The stack is served over plain HTTP, so the browser must not
          # upgrade its requests to HTTPS.
          FORCE_HTTPS: 'false'
        run: |
          docker --version
          docker compose version
          set -e
          for attempt in 1 2; do
            python scripts/docker/compose_smoke.py --ci --keep-up --timeout-seconds 600 && break
            if [ $attempt -eq 2 ]; then exit 1; fi
            echo "Compose smoke failed. Retrying..."
          done

      - name: Wait for the demo catalogue
        env:
          API_ACCESS_KEY: ci-test-key
        run: |
          # The catalogue is seeded in the background when the backend starts,
          # and the seeding embeds every listing. The e2e suite draws that
          # catalogue on the map, so it waits for the listings to arrive
          # instead of asserting against an empty map.
          for attempt in $(seq 1 60); do
            if curl -s -m 30 -X POST http://localhost:8082/api/v1/search \
              -H 'Content-Type: application/json' \
              -H "X-API-Key: ${API_ACCESS_KEY}" \
              -d '{"query":"apartment in Krakow"}' | grep -q '"latitude"'; then
              echo "the catalogue has listings"
              exit 0
            fi
            echo "waiting for the demo catalogue ($attempt/60)"
            sleep 10
          done
          echo "the demo catalogue never filled up" >&2
          exit 1

      - name: E2E against the real stack
        env:
          CI: 'true'
          E2E_STACK: 'true'
          STACK_BACKEND_URL: http://localhost:8082
          STACK_FRONTEND_URL: http://localhost:3082
          API_ACCESS_KEY: ci-test-key
          PLAYWRIGHT_BASE_URL: http://localhost:3082
          PLAYWRIGHT_START_WEB: 'false'
        run: npx playwright test e2e/infrastructure --project=desktop-chromium

      - name: Upload the stack e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-e2e-report
          path: artifacts/e2e-report/

      # The backend's end-to-end suite, against the stack this job built:
      # the real middleware, the real seeded catalogue, the real provider
      # (the local MockLLM - no paid key, no answer leaves the runner).
      #
      # It runs AFTER the Playwright step on purpose: the suite resets the
      # knowledge store, and the map the Playwright suite draws is read
      # from the seeded catalogue.
      - name: Set up Python (backend e2e)
        uses: ./.github/actions/setup-python
        with:
          working-directory: apps/api
          dev-requirements-file: requirements-dev.txt

      - name: Backend E2E against the real stack
        working-directory: apps/api
        env:
          # The stack's own backend, and the key it was started with.
          E2E_BASE_URL: http://localhost:8082
          API_ACCESS_KEY: ci-test-key
          # An origin the stack allows - the preflight is checked against
          # the stack's own origins, and the development origin is not one
          # of them.
          E2E_CORS_ORIGIN: http://localhost:3082
        run: python -m pytest tests/e2e_backend -v --tb=short

      - name: Tear the stack down
        if: always()
        env:
          POSTGRES_PASSWORD: ci-profile-not-started # pragma: allowlist secret - a throwaway value for a service that never starts
        run: docker compose -f deploy/compose/docker-compose.yml down --volumes --remove-orphans

  pipeline-health:
    runs-on: ubuntu-latest
    if: always()
    needs: [gitleaks, secret-validation, rule5-protected-paths, backend-lint, backend-tests,
            api-contract, cli-tests, backend-e2e, backend-resilience,
            frontend-build, security-sast, frontend-tests,
            security-deps, codeql-python, codeql-javascript, container-scan,
            lighthouse, e2e, compose-stack]
    permissions:
      contents: read
    steps:
      - name: Summarize pipeline health
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJson(needs) }};
            const rows = Object.entries(needs).map(([job, data]) => [job, (data && data.result) || 'unknown']);
            core.summary.addHeading('Pipeline Health');
            core.summary.addTable([['Job', 'Result'], ...rows]);
            const failures = rows.filter(([, result]) => result === 'failure');
            const skipped = rows.filter(([, result]) => result === 'skipped');
            const failureList = failures.map(([job, result]) => job + '(' + result + ')').join(', ');
            const skippedList = skipped.map(([job, result]) => job + '(' + result + ')').join(', ');

            if (failures.length) {
              core.summary.addRaw('Failed jobs: ' + failureList);
            }
            if (skipped.length) {
              core.summary.addRaw('\nSkipped jobs (expected on non-release branches): ' + skippedList);
            }
            if (!failures.length && !skipped.length) {
              core.summary.addRaw('All pipeline jobs succeeded.');
            }
            if (failures.length) {
              core.setFailed('Failed jobs: ' + failureList);
            }

            await core.summary.write();
