name: "Community Metrics"

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    name: Collect weekly metrics
    runs-on: ubuntu-latest
    if: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/community/collect_metrics.py --output docs/community/metrics

      - name: Generate latest summary
        run: |
          # Find the most recent snapshot and copy as latest
          LATEST=$(ls -t docs/community/metrics/*.json 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            cp "$LATEST" docs/community/metrics/latest.json
            echo "Latest snapshot: $LATEST"
          fi

      - name: Commit metrics (DISABLED - causes conflicts)
        if: false  # Disabled to prevent automatic commits causing merge conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/community/metrics/
          git diff --cached --quiet || git commit -m "docs(metrics): weekly community metrics snapshot"
          git push
